# ========================================================
# Nginx Reverse Proxy Configuration for dailyba.pdfumi.com
# File Location on VPS: /etc/nginx/sites-available/dailyba.pdfumi.com
# Symlink: sudo ln -s /etc/nginx/sites-available/dailyba.pdfumi.com /etc/nginx/sites-enabled/
# ========================================================

server {
    listen 80;
    listen [::]:80;
    server_name dailyba.pdfumi.com;

    # Maximum upload size for receipt OCR scans & PDF statements
    client_max_body_size 25M;

    # 1. Backend REST API (Maps to Docker container on host port 4005)
    location /api/ {
        proxy_pass http://127.0.0.1:4005;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        proxy_connect_timeout 60s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # 2. Frontend Next.js Web App (Maps to Docker container on host port 3005)
    location / {
        proxy_pass http://127.0.0.1:3005;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        proxy_connect_timeout 60s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
