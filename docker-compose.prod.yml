services:
  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?set ENCRYPTION_KEY in .env}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.8-flash}
      DB_PATH: /app/data/dailyba.db
    deploy:
      resources:
        limits:
          memory: 350M
    ports:
      - "4005:4000"
    volumes:
      - dailyba_data:/app/data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:4000/api/health"]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://dailyba.pdfumi.com}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 200M
    ports:
      - "3005:3000"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 15s
      timeout: 5s
      start_period: 5s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Opsional: Caddy internal jika dideploy di VPS mandiri terpisah (bukan sharing dengan Caddy pdfumi)
  # Jika sharing dengan Caddy pdfumi, service ini bisa dinonaktifkan (cukup gunakan port 3005 & 4005)
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    profiles:
      - standalone
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_healthy
    environment:
      ACME_EMAIL: ${ACME_EMAIL:-admin@pdfumi.com}
      DOMAIN_NAME: ${DOMAIN_NAME:-dailyba.pdfumi.com}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - dailyba_caddy_data:/data
      - dailyba_caddy_config:/config
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  dailyba_data:
  dailyba_caddy_data:
  dailyba_caddy_config:
